syntax = "proto3";

package soda.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/LevitateOS/soda-os/internal/gen/soda/v2;sodav2";

service SodaService {
  rpc Health(HealthRequest) returns (HealthResponse);

  rpc CreatePerson(CreatePersonRequest) returns (CreatePersonResponse);
  rpc ImportPerson(ImportPersonRequest) returns (ImportPersonResponse);
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
  rpc CreateSshDeviceKey(CreateSshDeviceKeyRequest) returns (CreateSshDeviceKeyResponse);
  rpc ListSshDeviceKeys(ListSshDeviceKeysRequest) returns (ListSshDeviceKeysResponse);
  rpc RevokeSshDeviceKey(RevokeSshDeviceKeyRequest) returns (RevokeSshDeviceKeyResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc ListProjectsForPerson(ListProjectsForPersonRequest) returns (ListProjectsForPersonResponse);

  rpc AddCollaborator(AddCollaboratorRequest) returns (AddCollaboratorResponse);
  rpc ListCollaborators(ListCollaboratorsRequest) returns (ListCollaboratorsResponse);

  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);

  rpc GetDeployKey(GetDeployKeyRequest) returns (GetDeployKeyResponse);
  rpc GetProjectToolchain(GetProjectToolchainRequest) returns (GetProjectToolchainResponse);

  rpc StartProvisioning(StartProvisioningRequest) returns (StartProvisioningResponse);
  rpc ListProvisioningJobs(ListProvisioningJobsRequest) returns (ListProvisioningJobsResponse);

  rpc GetHostStatus(GetHostStatusRequest) returns (GetHostStatusResponse);

  rpc GetOSUpdateStatus(GetOSUpdateStatusRequest) returns (GetOSUpdateStatusResponse);
  rpc CheckOSUpdate(CheckOSUpdateRequest) returns (CheckOSUpdateResponse);
  rpc StageOSUpdate(StageOSUpdateRequest) returns (StageOSUpdateResponse);
  rpc ActivateOSUpdate(ActivateOSUpdateRequest) returns (ActivateOSUpdateResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN = 1;
  ROLE_DEVELOPER = 2;
}

enum ToolchainProfile {
  TOOLCHAIN_PROFILE_UNSPECIFIED = 0;
  TOOLCHAIN_PROFILE_WEB = 1;
  TOOLCHAIN_PROFILE_PYTHON = 2;
  TOOLCHAIN_PROFILE_RUST = 3;
  TOOLCHAIN_PROFILE_GO = 4;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_INSTALLING = 1;
  JOB_STATE_READY = 2;
  JOB_STATE_FAILED = 3;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_READY = 1;
  RUNTIME_STATE_DEGRADED = 2;
  RUNTIME_STATE_UNAVAILABLE = 3;
}

message Person {
  reserved 6;
  reserved "ssh_public_key";

  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  Role role = 5;
}

message SshDeviceKey {
  string id = 1;
  string person_id = 2;
  string label = 3;
  string public_key = 4;
  string fingerprint = 5;
  string identity_file_hint = 6;
  google.protobuf.Timestamp created_at = 7;
}

message EmptyProjectSource {}

message GitProjectSource {
  string remote_url = 1;
}

message ProjectSource {
  oneof source {
    EmptyProjectSource empty = 1;
    GitProjectSource git = 2;
  }
}

message Project {
  string id = 1;
  string slug = 2;
  string name = 3;
  string unix_user = 4;
  ToolchainProfile profile = 5;
  ProjectSource source = 6;
}

message Membership {
  string project_id = 1;
  string person_id = 2;
}

message Worktree {
  string id = 1;
  string project_id = 2;
  string person_id = 3;
  string name = 4;
  string branch = 5;
  string path = 6;
}

message ToolchainInstallation {
  string id = 1;
  ToolchainProfile profile = 2;
  string version = 3;
  string path = 4;
  string checksum = 5;
  JobState state = 6;
}

message ProjectToolchainResolution {
  string project_id = 1;
  string toolchain_installation_id = 2;
}

message ProvisioningJob {
  string id = 1;
  string project_id = 2;
  JobState state = 3;
  optional string error = 4;
}

message DeployKey {
  string project_id = 1;
  string public_key = 2;
}

message ServiceStatus {
  string name = 1;
  RuntimeState state = 2;
}

message NetworkInterface {
  string name = 1;
  repeated string addresses = 2;
}

message FilesystemStatus {
  string path = 1;
  uint64 total_bytes = 2;
  uint64 available_bytes = 3;
}

message LoadAverage {
  double one_minute = 1;
  double five_minutes = 2;
  double fifteen_minutes = 3;
}

message HostStatus {
  reserved 13, 14;
  reserved "ssh_observer", "git_observer";

  google.protobuf.Timestamp sampled_at = 1;
  RuntimeState overall = 2;
  repeated ServiceStatus services = 3;
  bool ssh_firewall_ready = 4;
  bool cockpit_firewall_ready = 5;
  repeated NetworkInterface interfaces = 6;
  optional double cpu_percent = 7;
  LoadAverage load_average = 8;
  uint64 uptime_seconds = 9;
  uint64 memory_total_bytes = 10;
  uint64 memory_available_bytes = 11;
  repeated FilesystemStatus filesystems = 12;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  string version = 3;
}

message CreatePersonRequest {
  reserved 5;
  reserved "ssh_public_key";

  string username = 1;
  string display_name = 2;
  string email = 3;
  Role role = 4;
  string password = 6;
}

message CreatePersonResponse {
  Person person = 1;
}

message ImportPersonRequest {
  reserved 5;
  reserved "ssh_public_key";

  string username = 1;
  string display_name = 2;
  string email = 3;
  Role role = 4;
}

message ImportPersonResponse {
  Person person = 1;
}

message ListPeopleRequest {}

message ListPeopleResponse {
  repeated Person people = 1;
}

message CreateSshDeviceKeyRequest {
  string person_id = 1;
  string label = 2;
  string public_key = 3;
  string identity_file_hint = 4;
}

message CreateSshDeviceKeyResponse {
  SshDeviceKey key = 1;
}

message ListSshDeviceKeysRequest {
  string person_id = 1;
}

message ListSshDeviceKeysResponse {
  repeated SshDeviceKey keys = 1;
}

message RevokeSshDeviceKeyRequest {
  string person_id = 1;
  string key_id = 2;
}

message RevokeSshDeviceKeyResponse {
  SshDeviceKey key = 1;
}

message CreateProjectRequest {
  string slug = 1;
  string name = 2;
  ToolchainProfile profile = 3;
  ProjectSource source = 4;
  repeated string initial_person_ids = 5;
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message ListProjectsForPersonRequest {
  string person_id = 1;
}

message ListProjectsForPersonResponse {
  repeated Project projects = 1;
}

message AddCollaboratorRequest {
  string project_id = 1;
  string person_id = 2;
}

message AddCollaboratorResponse {
  Membership membership = 1;
  Worktree worktree = 2;
}

message ListCollaboratorsRequest {
  string project_id = 1;
}

message Collaborator {
  Person person = 1;
  Membership membership = 2;
  repeated Worktree worktrees = 3;
}

message ListCollaboratorsResponse {
  repeated Collaborator collaborators = 1;
}

message ListWorktreesRequest {
  string project_id = 1;
}

message ListWorktreesResponse {
  repeated Worktree worktrees = 1;
}

message GetDeployKeyRequest {
  string project_id = 1;
}

message GetDeployKeyResponse {
  DeployKey deploy_key = 1;
}

message GetProjectToolchainRequest {
  string project_id = 1;
}

message GetProjectToolchainResponse {
  ToolchainInstallation installation = 1;
  ProjectToolchainResolution resolution = 2;
}

message StartProvisioningRequest {
  string project_id = 1;
}

message StartProvisioningResponse {
  ProvisioningJob job = 1;
}

message ListProvisioningJobsRequest {
  string project_id = 1;
}

message ListProvisioningJobsResponse {
  repeated ProvisioningJob jobs = 1;
}

message GetHostStatusRequest {}

message GetHostStatusResponse {
  HostStatus host = 1;
}

message OSDeployment {
  string image_reference = 1;
  string version = 2;
  string digest = 3;
  string architecture = 4;
  string signature = 5;
  bool incompatible = 6;
  bool download_only = 7;
}

message OSUpdateStatus {
  OSDeployment booted = 1;
  optional OSDeployment staged = 2;
  bool read_only = 3;
}

message OSRelease {
  string image_reference = 1;
  string version = 2;
  string source_revision = 3;
  string fedora_base_reference = 4;
  string digest = 5;
  uint32 state_schema = 6;
  bool available = 7;
}

message GetOSUpdateStatusRequest {}

message GetOSUpdateStatusResponse {
  OSUpdateStatus status = 1;
}

message CheckOSUpdateRequest {}

message CheckOSUpdateResponse {
  OSRelease release = 1;
}

message StageOSUpdateRequest {
  string image_reference = 1;
}

message StageOSUpdateResponse {
  OSUpdateStatus status = 1;
}

message ActivateOSUpdateRequest {
  bool confirm_reboot = 1;
}

message ActivateOSUpdateResponse {
  bool reboot_requested = 1;
}
