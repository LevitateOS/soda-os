{{define "projects.html"}}{{template "header" .}}
<h1>Projects</h1>
{{template "project-list" .}}
{{if .Admin}}
{{template "project-create" .}}
{{end}}
{{template "footer" .}}{{end}}

{{define "project-create"}}
<section id="project-create" class="panel" aria-live="polite">
  <h2>Create project</h2>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/projects" hx-post="/projects" hx-target="#project-create" hx-swap="outerHTML" hx-disabled-elt="button">
    <label>Slug <input name="slug" placeholder="my-project" required></label>
    <label>Name <input name="name" required></label>
    <label>Toolchain <select name="profile"><option value="web">Web · Node + Bun</option><option value="python">Python · CPython + uv</option><option value="rust">Rust</option><option value="go">Go</option></select></label>
    <label>Git URL <input name="remote_url" placeholder="Leave empty for a new repository"></label>
    <button type="submit">Create project</button>
  </form>
</section>
{{end}}
