{{define "header"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="identity">
        <a class="brand" href="/" aria-label="Soda OS home"><img src="/static/soda-logo.svg" alt="soda os"></a>
        <span class="muted">0.1.0</span>
      </div>
      {{if .User.Username}}
      <nav aria-label="Primary">
        <a href="/projects">Projects</a>
        <a href="/profiles">Toolchains</a>
        {{if .Admin}}<a href="/people">People</a>{{end}}
        <form method="post" action="/logout"><button type="submit">Sign out {{.User.Username}}</button></form>
      </nav>
      {{end}}
    </header>
    <main>
{{end}}

{{define "footer"}}
    </main>
  </body>
</html>
{{end}}
