{{define "people.html"}}{{template "header" .}}
<h1>People</h1>
<section class="panel">
  <h2>Registered accounts</h2>
  {{if .People}}<table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th></tr></thead><tbody>
  {{range .People}}<tr><td>{{.DisplayName}}</td><td><code>{{.Username}}</code></td><td>{{.Email}}</td><td>{{.Role}}</td></tr>{{end}}
  </tbody></table>{{else}}<p>No people are registered.</p>{{end}}
</section>
<section class="panel">
  <h2>Add person</h2>
  <form method="post" action="/people" hx-post="/people">
    <label>Username <input name="username" required></label>
    <label>Display name <input name="display_name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Role <select name="role"><option value="developer">Developer</option><option value="admin">Administrator</option></select></label>
    <label>Initial password <input type="password" name="password" required></label>
    <label>SSH public key <textarea name="ssh_public_key" rows="4" required></textarea></label>
    <button type="submit">Add person</button>
  </form>
</section>
{{template "footer" .}}{{end}}
