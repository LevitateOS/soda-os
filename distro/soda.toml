schema_version = 2

[identity]
name = "Soda OS"
id = "sodaos"
version = "0.3.1"
hostname = "soda"

[image]
registry = "ghcr.io/levitateos/soda-os"
state_schema = 3

[distribution]
github_repository = "LevitateOS/soda-os"
index_url = "https://github.com/LevitateOS/soda-os/releases/latest/download/soda-os-release-index.json"

[build]
source_date_epoch = 1787825905

[network]
cockpit_port = 9090
mdns_name = "soda.local"

[paths]
state_dir = "/var/lib/soda"
projects_dir = "/srv/soda/projects"
toolchains_dir = "/opt/soda/toolchains"
daemon_socket = "/run/soda/sodad.sock"
