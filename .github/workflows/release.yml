name: Bootstrap x86-64 fallback signature

on:
  push:
    branches:
      - production

permissions: {}

concurrency:
  group: soda-fallback-bootstrap-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bootstrap-fallback-x86_64:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' && github.repository == 'LevitateOS/soda-os'
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify the exact x86-64 fallback
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ghcr.io/levitateos/soda-os@sha256:d57060e9eb5953043e7ce18b8e002422010f6e17c1408211907d31fd1cfa5edd
          CERTIFICATE_IDENTITY: https://github.com/LevitateOS/soda-os/.github/workflows/release.yml@refs/heads/production
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -eu
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/production
          test "$GITHUB_REPOSITORY" = LevitateOS/soda-os

          docker pull --quiet --platform linux/amd64 "$IMAGE_REFERENCE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REFERENCE")" = linux/amd64

          docker_config="$RUNNER_TEMP/soda-bootstrap-docker"
          signature_output="$RUNNER_TEMP/soda-bootstrap-signatures.json"
          signature_error="$RUNNER_TEMP/soda-bootstrap-signature-error"
          install -d -m 0700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          cleanup() {
            rm -f -- "$docker_config/config.json" "$signature_output" "$signature_error"
            rmdir -- "$docker_config" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          verify_exact_signature() {
            cosign verify \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-github-workflow-ref refs/heads/production \
              --certificate-github-workflow-repository LevitateOS/soda-os \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger push \
              "$IMAGE_REFERENCE"
          }

          if verify_exact_signature; then
            echo 'the exact x86-64 fallback already has this production-workflow signature'
            exit 0
          fi

          if cosign download signature "$IMAGE_REFERENCE" >"$signature_output" 2>"$signature_error"; then
            echo 'signature material exists but no signature matches the exact production workflow' >&2
            exit 1
          fi
          expected="$IMAGE_REFERENCE: no signatures associated"
          if test "$(grep -Fc "$expected" "$signature_error")" -ne 2 || test "$(wc -l < "$signature_error")" -ne 2; then
            echo 'signature state is unknown; refusing to sign' >&2
            exit 1
          fi

          cosign sign --yes "$IMAGE_REFERENCE"
          verify_exact_signature
