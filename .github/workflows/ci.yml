name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install source-check prerequisites
        run: sudo apt-get update && sudo apt-get install --yes librsvg2-bin
      - name: Check tracked diff integrity
        run: git diff --check HEAD^
      - name: Check acceptance entry point
        run: go run ./cmd/soda-acceptance --help >/dev/null
      - name: Check source formatting and complexity
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -not -path './.artifacts/*'))"
          ./scripts/check-complexity.sh
          ./scripts/check-release-identity.sh
      - name: Test source contracts
        run: |
          node --test cockpit/soda-projects/*.test.mjs
          go vet ./...
          go test -race ./internal/acceptance
          go test ./...
          go run ./cmd/soda-image --architecture aarch64 check
          go run ./cmd/soda-image --architecture x86_64 check
