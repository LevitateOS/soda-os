name: Local runner proof

on:
  push:
    branches:
      - codex/manage-local-ci-runners

jobs:
  packaged-local-runner:
    runs-on: [self-hosted, soda-issue-47]
    timeout-minutes: 5
    steps:
      - name: Verify Soda runner boundary
        shell: bash
        run: |
          test "$(id -un)" = soda-runner-gh-proof
          test "$(uname -m)" = x86_64
          test ! -e /home/runner-admin
          mise --version
          test ! -e /usr/share/soda/toolset-commands.txt
          printf '%s\n' provider-native-job > local-runner-proof.txt
          grep -Fx provider-native-job local-runner-proof.txt
