schema_version = 2

[identity]
name = "Soda OS"
id = "sodaos"
version = "0.2.0"
hostname = "soda"

[image]
registry = "registry.soda.local/soda/os"
state_schema = 3

[build]
source_date_epoch = 1787825905

[network]
cockpit_port = 9090
