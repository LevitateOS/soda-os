[Service]
# Tailscale's durable node identity belongs with Soda's other mutable host state.
StateDirectory=
StateDirectory=soda/tailscale
ExecStart=
ExecStart=/usr/bin/tailscaled --state=/var/lib/soda/tailscale/tailscaled.state --statedir=/var/lib/soda/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT}
