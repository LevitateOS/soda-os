# Soda OS Anaconda profile layered on Fedora's installer defaults.

[Profile]
profile_id = sodaos
base_profile = fedora

[Anaconda]
optional_modules =
    org.fedoraproject.Anaconda.Modules.Subscription
    org.fedoraproject.Anaconda.Addons.Kdump

[Profile Detection]
os_id = sodaos

[Installation Target]
can_copy_input_kickstart = False
can_save_output_kickstart = False

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/soda.css
hidden_spokes = PasswordSpoke
