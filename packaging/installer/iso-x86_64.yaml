label: "SodaOS-Installer"
grub2:
  default: 0
  timeout: 10
  entries:
    - name: "Install Soda OS"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=SodaOS-Installer inst.ks=hd:LABEL=OEMDRV:/ks.cfg inst.nosave=all_ks console=tty0 inst.graphical enforcing=0"
      initrd: "/images/pxeboot/initrd.img"
