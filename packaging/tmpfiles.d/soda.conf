# Mutable Soda state belongs on the host filesystem, never in the OS image.
d /var/lib/soda 0750 root soda-api -
d /var/lib/soda/projects 0755 root root -
d /var/lib/soda/toolchains 0755 root root -
d /var/log/soda 0750 root soda-api -
d /var/log/soda/sodad 0750 root soda-api -
d /var/log/soda/soda-authd 0750 root soda-api -
d /var/log/soda/soda-cockpit 0750 soda-cockpit soda-api -

# Fedora bootc exposes /srv through /var/srv. These canonical paths remain
# visible to users as /srv/soda and /srv/soda/projects.
d /var/srv/soda 0755 root root -
d /var/srv/soda/projects 0755 root root -
